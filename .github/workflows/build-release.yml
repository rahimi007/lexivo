name: Build Release APK (signed)

on:
  push:
    branches: [ main ]
    tags: ['v*', 'release-*']
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew not found. Commit the Gradle wrapper (gradlew, gradlew.bat and gradle/wrapper/gradle-wrapper.jar)." >&2
            exit 1
          fi

      - name: Reconstruct keystore from secret (do not print contents)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ./.keystore
          # use printf to avoid extra newline expansion
          printf "%s" "${KEYSTORE_BASE64}" | base64 --decode > ./.keystore/release.jks
          chmod 600 ./.keystore/release.jks

      - name: Build signed Release APK
        env:
          # Point the build to the reconstructed keystore and pass passwords/alias from repository secrets
          KEYSTORE_PATH: ${{ github.workspace }}/.keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew clean assembleRelease --no-daemon --warning-mode all

      - name: Verify APK signing
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Signed APK not found at $APK_PATH" >&2
            ls -R app/build/outputs || true
            exit 1
          fi
          echo "Using apksigner from the newest build-tools available"
          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools"
          if [ -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_VERSION=$(ls "$BUILD_TOOLS_DIR" | sort -V | tail -n1)
            APKSIGNER="$BUILD_TOOLS_DIR/$BUILD_TOOLS_VERSION/apksigner"
          else
            # Fallback: try to find apksigner on PATH
            APKSIGNER=$(which apksigner || true)
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found; skipping signature verification step" >&2
          else
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Cleanup keystore
        run: |
          shred -u ./.keystore/release.jks || rm -f ./.keystore/release.jks
