name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{if ($1 == 1) print $2; else print $1}')
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, which is lower than 17."
            exit 1
          fi
          echo "Java version is $JAVA_VER (>= 17)."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found, generating..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          
          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore could not be created."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk is missing."
            echo "Discovered APK paths:"
            find app/build/outputs/apk -type f
            exit 1
          fi
          echo "APK successfully verified at app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
