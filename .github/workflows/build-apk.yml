```yaml
name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{if ($1 == 1) print $2; else print $1}')

          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, which is lower than 17."
            exit 1
          fi

          echo "Java version is $JAVA_VER (>= 17)."

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/lexivo-release.jks"
          chmod 600 "$GITHUB_WORKSPACE/lexivo-release.jks"

          if [ ! -s "$GITHUB_WORKSPACE/lexivo-release.jks" ]; then
            echo "Error: Release keystore could not be created."
            exit 1
          fi

          echo "Release keystore restored successfully."

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/lexivo-release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "Error: Release APK is missing."
            echo "Discovered APK files:"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi

          echo "Release APK successfully created."
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name "apksigner" | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner was not found."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK signature verification completed successfully."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lexivo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up release keystore
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/lexivo-release.jks"
          echo "Temporary release keystore removed."
```
